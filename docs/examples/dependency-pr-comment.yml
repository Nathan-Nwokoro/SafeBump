name: SafeBump dependency PR comment

on:
  workflow_run:
    workflows: [SafeBump dependency PR analysis]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download the analysis report
        uses: actions/download-artifact@v8
        with:
          name: safebump-pr-report
          path: ${{ runner.temp }}/safebump-report
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update the SafeBump comment
        uses: actions/github-script@v9
        env:
          SAFEBUMP_REPORT_DIRECTORY: ${{ runner.temp }}/safebump-report
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const directory = process.env.SAFEBUMP_REPORT_DIRECTORY;
            const marker = '<!-- safebump-dependency-analysis -->';
            const body = fs.readFileSync(path.join(directory, 'safebump-pr-report.md'), 'utf8');
            const issueNumberText = fs.readFileSync(
              path.join(directory, 'safebump-pr-number.txt'), 'utf8').trim();
            const issue_number = Number.parseInt(issueNumberText, 10);
            if (!Number.isSafeInteger(issue_number) || issue_number < 1 || !body.startsWith(marker)) {
              throw new Error('SafeBump artifact validation failed');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body
              });
            }
